# tmux config (runs inside Ghostty, see ~/.config/ghostty/config)

# GENERAL
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:RGB,xterm-256color:RGB"
set -g mouse on
set -g escape-time 10
set -g focus-events on
set -g history-limit 50000
set -g set-clipboard on
set -g allow-passthrough on
set -g extended-keys on
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
setw -g mode-keys vi
# Terminal title = tmux session name (replaces Ghostty's default 👻 title)
set -g set-titles on
set -g set-titles-string "#S"

# LEADER = ctrl+a (ctrl+a ctrl+a sends a literal ctrl+a, e.g. start of line)
unbind C-b
set -g prefix C-a
bind C-a send-prefix
bind R source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# TABS (tmux windows)
bind t new-window -c "#{pane_current_path}"
bind l next-window
bind h previous-window
bind e command-prompt -I "#W" -p "Enter new name for current TAB:" "rename-window '%%'"

# PANES
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind w confirm-before -p "kill-pane #P? (y/n)" kill-pane
bind m resize-pane -Z

# Resize mode: leader r, then hjkl (repeatable), q/esc or any other key to leave
bind r switch-client -T resize_pane
bind -T resize_pane h resize-pane -L 5 \; switch-client -T resize_pane
bind -T resize_pane j resize-pane -D 5 \; switch-client -T resize_pane
bind -T resize_pane k resize-pane -U 5 \; switch-client -T resize_pane
bind -T resize_pane l resize-pane -R 5 \; switch-client -T resize_pane
bind -T resize_pane q switch-client -T root
bind -T resize_pane Escape switch-client -T root

# Move between panes with ctrl+hjkl (no leader).
# In nvim the key passes through (smart-splits sets @pane-is-vim); at the
# tmux edge focus falls back to aerospace.
bind -n C-h if -F "#{@pane-is-vim}" "send-keys C-h" "if -F '#{pane_at_left}' 'run-shell -b \"/opt/homebrew/bin/aerospace focus left\"' 'select-pane -L'"
bind -n C-j if -F "#{@pane-is-vim}" "send-keys C-j" "if -F '#{pane_at_bottom}' 'run-shell -b \"/opt/homebrew/bin/aerospace focus down\"' 'select-pane -D'"
bind -n C-k if -F "#{@pane-is-vim}" "send-keys C-k" "if -F '#{pane_at_top}' 'run-shell -b \"/opt/homebrew/bin/aerospace focus up\"' 'select-pane -U'"
bind -n C-l if -F "#{@pane-is-vim}" "send-keys C-l" "if -F '#{pane_at_right}' 'run-shell -b \"/opt/homebrew/bin/aerospace focus right\"' 'select-pane -R'"
bind -T copy-mode-vi C-h select-pane -L
bind -T copy-mode-vi C-j select-pane -D
bind -T copy-mode-vi C-k select-pane -U
bind -T copy-mode-vi C-l select-pane -R

# WORKSPACES (tmux sessions)
bind s choose-tree -Zs
bind n command-prompt -p "Enter name for new workspace:" "new-session -s '%%' -c '#{pane_current_path}'"
bind k confirm-before -p "kill workspace #S? (y/n)" kill-session
bind c command-prompt -I "#S" -p "Enter new name for workspace:" "rename-session '%%'"

# COPY MODE
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# THEME (VS Code "Dark 2026"; matches ghostty theme vscode-dark-2026)
# Keep hex colours lowercase: "#D", "#S", ... are tmux format aliases.
# Left block works like VS Code's remote indicator and shows the mode:
# remote blue normal, accent blue leader, red resize
%hidden MODE_COLOR="#{?client_prefix,#3994bc,#{?#{==:#{client_key_table},resize_pane},#c72e0f,#0078d4}}"
%hidden MODE_ICON="#{?client_prefix,󰌌,#{?#{==:#{client_key_table},resize_pane},󰩨,}}"
%hidden GIT_BRANCH='#(b=$(git -C "#{pane_current_path}" branch --show-current 2>/dev/null) && [ -n "$b" ] && echo "  $b ")'

set -g status-position bottom
set -g status-justify left
set -g status-interval 5
set -g status-style "bg=#191a1b,fg=#8c8c8c"

set -g status-left-length 60
set -g status-left "#[fg=#ffffff,bg=${MODE_COLOR}] ${MODE_ICON} #S #[fg=#8c8c8c,bg=#191a1b]${GIT_BRANCH} "

# Tabs: inactive dimmed, active brighter with a blue underline (VS Code's active-tab border)
setw -g window-status-separator ""
setw -g window-status-format "#[fg=#8c8c8c,bg=#191a1b] #I #W#{?window_zoomed_flag, 󰁌,} "
setw -g window-status-current-format "#[fg=#bfbfbf,bg=#121314,underscore,us=#3994bc] #I #W#{?window_zoomed_flag, 󰁌,} #[default]"
setw -g window-status-activity-style "fg=#cca700"
setw -g monitor-activity on
set -g visual-activity off

set -g status-right-length 100
set -g status-right "#{?pane_in_mode,#[fg=#ffffff#,bg=#3994bc] 󰆏 COPY #[fg=#8c8c8c#,bg=#191a1b] ,}  󰉋 #{b:pane_current_path}    #{pane_current_command}   󰥔 %H:%M "

# Panes
set -g pane-border-lines single
set -g pane-border-style "fg=#2a2b2c"
set -g pane-active-border-style "fg=#3994bc"
set -g display-panes-active-colour "#3994bc"
set -g display-panes-colour "#8c8c8c"

# Prompts (quick input), menus, popups, copy-mode selection
set -g message-style "bg=#202122,fg=#bfbfbf"
set -g message-command-style "bg=#202122,fg=#bfbfbf"
set -g mode-style "bg=#276782,fg=#ffffff"
set -g menu-style "bg=#202122,fg=#bfbfbf"
set -g menu-selected-style "bg=#297aa0,fg=#ffffff"
set -g menu-border-style "fg=#2a2b2c"
set -g menu-border-lines rounded
set -g popup-style "bg=#202122"
set -g popup-border-style "fg=#2a2b2c"
set -g popup-border-lines rounded
setw -g clock-mode-colour "#3994bc"
